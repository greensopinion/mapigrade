name: mapigrade
description: "Renders a MapLibre Native map into a Flutter Texture on the GPU, through MapLibre Native FFI, with a map widget whose camera MapLibre owns."
version: 0.2.0-beta.1
repository: https://github.com/greensopinion/mapigrade/tree/v0.2.0-beta.1/packages/mapigrade
issue_tracker: https://github.com/greensopinion/mapigrade/issues
topics:
  - maps
  - maplibre
  - vector-tiles

resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  latlong2: ^0.10.1

dev_dependencies:
  analyzer: ^14.5.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path: ^1.9.1
  yaml: ^3.1.4

flutter:
  plugin:
    platforms:
      # The dartPluginClass entries register the third-party notices with the
      # license registry (design D94 of the third-party-notices change).
      ios:
        pluginClass: MapigradePlugin
        sharedDarwinSource: true
        dartPluginClass: MapigradeNotices
        dartFileName: src/notices/third_party_notices.dart
      macos:
        pluginClass: MapigradePlugin
        sharedDarwinSource: true
        dartPluginClass: MapigradeNotices
        dartFileName: src/notices/third_party_notices.dart

  # Third-party notices of MapLibre Native FFI, copied by
  # scripts/copy_ffi_notices.sh (design D91 and D93, and D217 of the
  # update-ffi-0-202610-3 change, D227 of the port-ffi-gesture-recognizer
  # change). The darwin and android notices differ between the macOS and iOS
  # builds and the Android build, or are for libraries that only one of them
  # links.
  assets:
    - path: notices/common/
    - path: notices/darwin/
      platforms: [ios, macos]
    - path: notices/android/
      platforms: [android]
