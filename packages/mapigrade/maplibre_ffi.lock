# The MapLibre Native FFI that the package uses (design D99 of the
# publish-readiness change). Shell syntax: scripts/build_maplibre_ffi.sh and
# the other scripts source it, and android/build.gradle.kts reads it.
#
# The upstream release whose artifacts the package uses. Empty while the pin is
# a commit that no release contains (design D219 of the
# port-ffi-gesture-recognizer change): Android builds then need
# scripts/build_maplibre_ffi.sh, and only a prerelease without Android can be
# released (design D252 of the apple-only-beta-release change).
MAPLIBRE_FFI_VERSION=
# The xcframework zip of that release, or without a release, the zip of a
# local build at MAPLIBRE_FFI_COMMIT that we host as a release asset of
# greensopinion/mapigrade (scripts/package_xcframework.sh --local), and its
# `swift package compute-checksum` value. scripts/update_ffi_pins.sh writes
# both into darwin/mapigrade/Package.swift. Never replace a hosted asset: a
# new build gets a new release tag.
MAPLIBRE_FFI_XCFRAMEWORK_URL=https://github.com/greensopinion/mapigrade/releases/download/maplibre-native-ffi-4371ff6/MaplibreNativeC.xcframework.zip
MAPLIBRE_FFI_XCFRAMEWORK_CHECKSUM=ef00de824a5b3d162efbe9fd887a55a07172d9d5e1ea23df52cccaa83dedaef4
MAPLIBRE_FFI_REPO=https://github.com/maplibre/maplibre-native-ffi.git
# The commit that scripts/build_maplibre_ffi.sh builds locally. With a release,
# it is the commit of the release's tag, which artifact.json in the release's
# tarballs states as gitSha.
MAPLIBRE_FFI_COMMIT=4371ff607e0bd22115d390de27d72a54987cc6c7
# The presets that make up MaplibreNativeC.xcframework, one slice each.
MAPLIBRE_FFI_PRESETS="macos-arm64 ios-arm64 ios-simulator-arm64"
# The Android presets. Each is installed on its own and is not part of the
# xcframework.
MAPLIBRE_FFI_ANDROID_PRESETS="android-arm64"
