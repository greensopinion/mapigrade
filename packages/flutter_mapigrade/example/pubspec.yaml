name: flutter_mapigrade_example
description: "Shows a MapLibre map as the base layer of a flutter_map map, with a marker above it."
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_map: 8.3.2
  flutter_mapigrade:
    path: ../
  latlong2: ^0.10.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
