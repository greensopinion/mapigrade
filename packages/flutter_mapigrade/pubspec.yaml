name: flutter_mapigrade
description: "Displays a MapLibre Native map as the base layer of a flutter_map map, rendered on the GPU through MapLibre Native FFI."
version: 0.1.0
repository: https://github.com/greensopinion/mapigrade
issue_tracker: https://github.com/greensopinion/mapigrade/issues
topics:
  - maps
  - maplibre
  - flutter-map
  - vector-tiles

resolution: workspace

platforms:
  android:
  ios:
  macos:

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  mapigrade: '>=0.1.0 <0.1.1'

dev_dependencies:
  analyzer: ^14.5.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path: ^1.9.1
  pub_semver: ^2.2.1
  yaml: ^3.1.4

