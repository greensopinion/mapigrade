name: flutter_mapigrade
description: "Displays a MapLibre Native map in a Flutter Texture widget, rendered on the GPU through MapLibre Native FFI."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  hooks: ^2.2.0
  latlong2: ^0.10.1

dev_dependencies:
  analyzer: ^14.5.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path: ^1.9.1

flutter:
  plugin:
    platforms:
      android:
        package: com.greensopinion.flutter_mapigrade
        pluginClass: MapigradePlugin
      ios:
        pluginClass: MapigradePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MapigradePlugin
        sharedDarwinSource: true
