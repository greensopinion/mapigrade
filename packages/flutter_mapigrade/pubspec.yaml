name: flutter_mapigrade
description: "Displays a MapLibre Native map in a Flutter Texture widget, rendered on the GPU through MapLibre Native FFI."
version: 0.0.1
repository: https://github.com/greensopinion/mapigrade
issue_tracker: https://github.com/greensopinion/mapigrade/issues
topics:
  - maps
  - maplibre
  - flutter-map
  - vector-tiles

resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  hooks: ^2.2.0
  latlong2: ^0.10.1

dev_dependencies:
  analyzer: ^14.5.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path: ^1.9.1
  yaml: ^3.1.4

flutter:
  plugin:
    platforms:
      # The dartPluginClass entries register the third-party notices with the
      # license registry (design D94 of the third-party-notices change).
      android:
        package: com.greensopinion.flutter_mapigrade
        pluginClass: MapigradePlugin
        dartPluginClass: MapigradeAndroidNotices
        dartFileName: src/notices/third_party_notices.dart
      ios:
        pluginClass: MapigradePlugin
        sharedDarwinSource: true
        dartPluginClass: MapigradeDarwinNotices
        dartFileName: src/notices/third_party_notices.dart
      macos:
        pluginClass: MapigradePlugin
        sharedDarwinSource: true
        dartPluginClass: MapigradeDarwinNotices
        dartFileName: src/notices/third_party_notices.dart

  # Third-party notices of MapLibre Native FFI, copied by
  # scripts/copy_ffi_notices.sh (design D91 and D93). The Android notices are
  # for libraries that only the Android build links.
  assets:
    - path: notices/common/
    - path: notices/android/
      platforms: [android]
